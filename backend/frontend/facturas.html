<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Emitir Préstamo o Factura - R&M Inversiones</title><link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/styles.css"></head><body class="bg-gray-900 text-gray-100 font-sans antialiased"><div class="flex h-screen overflow-hidden"><div class="hidden md:flex md:flex-shrink-0"><div class="flex flex-col w-64 bg-gray-800 border-r border-gray-700"><div class="flex items-center justify-center h-16 bg-gray-900 px-4"><img src="/static/img/logo-rym.jpeg" alt="Logo" class="h-8 w-auto mr-2 rounded"><span class="text-lg font-bold text-yellow-500">R&M Inversiones</span></div><div class="flex flex-col flex-grow px-4 py-4 space-y-2"><a href="dashboard.html" class="text-gray-300 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-md font-medium">Dashboard</a><a href="clientes.html" class="text-gray-300 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-md font-medium">Clientes</a><a href="facturas.html" class="bg-blue-600 text-white px-4 py-2 rounded-md font-medium">Facturas</a><a href="cartera.html" class="text-gray-300 hover:bg-gray-700 hover:text-white px-4 py-2 rounded-md font-medium">Cartera y Mora</a></div></div></div><div class="flex flex-col flex-1 overflow-y-auto"><div class="container mx-auto px-6 py-8"><h1 class="text-2xl font-bold mb-2">Emitir Préstamo o Factura</h1><p class="text-gray-400 mb-6">Panel de control y registro rápido de cobros</p><div class="bg-gray-800 border border-gray-700 rounded-lg p-6 max-w-3xl"><form id="factura-form" class="space-y-4"><div><label class="block text-sm font-medium mb-1">Nombre del Cliente</label><select id="cliente-select" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" required><option value="">Seleccione un cliente...</option></select></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4"><div><label class="block text-sm font-medium mb-1">¿Cómo pagará? (Frecuencia)</label><select id="frecuencia" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="Semanal">Semanal</option><option value="Quincenal">Quincenal</option><option value="Mensual">Mensual</option></select></div><div><label class="block text-sm font-medium mb-1">Fecha de Vencimiento</label><input type="date" id="fecha-vencimiento" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" required></div></div><div><label class="block text-sm font-medium mb-1">Descripción del Préstamo</label><input type="text" id="descripcion" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" value="Préstamo personal con interés"></div><div><label class="block text-sm font-medium mb-1">Monto Total a Cobrar (RD$)</label><input type="number" step="0.01" id="monto" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white" placeholder="0.00" required></div><div class="flex flex-wrap gap-4 pt-4"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded transition">Emitir Préstamo</button><button type="button" id="btn-whatsapp" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded transition">WhatsApp</button><button type="button" id="btn-pdf" class="bg-blue-800 hover:bg-blue-900 text-white font-medium px-4 py-2 rounded transition">Descargar PDF</button></div></form></div></div></div></div><script src="/static/js/app.js"></script></body></html>
