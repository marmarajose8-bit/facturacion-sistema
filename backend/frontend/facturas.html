<!-- Modal Nueva Factura con Selector Desplegable de Clientes -->
<div id="modalNuevaFactura" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
  <div class="bg-gray-900 p-6 rounded-lg w-full max-w-md border border-gray-800">
    <h3 class="text-lg font-bold text-white mb-4">Nueva factura</h3>
    <form id="formNuevaFactura" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">Cliente</label>
        <select id="clienteSelect" name="cliente_id" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm focus:outline-none focus:border-blue-500" required>
          <option value="">Seleccione un cliente...</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Fecha de vencimiento</label>
        <input type="date" name="fecha_vencimiento" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm" required>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Frecuencia de pago</label>
        <select name="frecuencia" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm">
          <option value="Quincenal">Quincenal</option>
          <option value="Mensual">Mensual</option>
          <option value="Diario">Diario</option>
        </select>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Número de cuotas</label>
          <input type="number" name="num_cuotas" value="12" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Tasa de Interés (%)</label>
          <input type="number" step="0.1" name="tasa_interes" value="15" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Monto del préstamo</label>
        <input type="number" name="monto_prestamo" class="w-full bg-gray-800 border border-gray-700 text-white rounded p-2 text-sm" required>
      </div>
      <div class="flex justify-end space-x-2 pt-2">
        <button type="button" onclick="cerrarModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-sm">Cancelar</button>
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Emitir factura</button>
      </div>
    </form>
  </div>
</div>
<script>
  // Carga automática de clientes en el desplegable
  fetch('/api/clientes')
    .then(res => res.json())
    .then(data => {
      const select = document.getElementById('clienteSelect');
      if(data && Array.isArray(data)) {
        data.forEach(c => {
          let opt = document.createElement('option');
          opt.value = c.id || c.nombre;
          opt.textContent = c.nombre || c.razon_social;
          select.appendChild(opt);
        });
      }
    }).catch(err => console.error("Error cargando clientes:", err));
</script>
