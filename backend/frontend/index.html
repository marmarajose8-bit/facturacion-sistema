<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingresar — RYM Inversiones</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/styles.css" />
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 mb-3">
        <img src="static/img/logo-rym.jpeg" alt="RYM Inversiones" class="w-11 h-11 rounded-lg object-cover" />
        <span class="text-lg font-semibold tracking-tight">RYM<span style="color:var(--accent)"> Inversiones</span></span>
      </div>
      <p class="text-sm" style="color:var(--text-dim)">Inversiones personales y empresariales — control de facturación y cobros</p>
    </div>

    <form id="loginForm" class="panel p-8 space-y-4">
      <div>
        <label class="text-xs" style="color:var(--text-dim)">Correo electrónico</label>
        <input type="email" id="email" required class="w-full mt-1" placeholder="admin@empresa.com" />
      </div>
      <div>
        <label class="text-xs" style="color:var(--text-dim)">Contraseña</label>
        <div class="relative mt-1">
          <input type="password" id="password" required class="w-full pr-10" placeholder="••••••••" />
          <button type="button" id="togglePassword" aria-label="Mostrar contraseña"
            class="absolute right-2 top-1/2 -translate-y-1/2 p-1"
            style="color:var(--text-dim); background:transparent; border:none; cursor:pointer;">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary w-full">Entrar</button>
      <p id="errorMsg" class="text-sm text-center hidden" style="color:var(--danger-2)"></p>
    </form>

    <p class="text-center text-xs mt-6" style="color:var(--text-dim)">
      ¿No tienes cuenta? Créala vía <code class="font-mono-ledger">/api/auth/registro</code> (endpoint protegido para el primer admin).
    </p>
  </div>

<script src="static/js/app.js"></script>
<script>
document.getElementById("togglePassword").addEventListener("click", () => {
  const input = document.getElementById("password");
  const icon = document.getElementById("eyeIcon");
  const mostrando = input.type === "text";
  input.type = mostrando ? "password" : "text";
  document.getElementById("togglePassword").setAttribute(
    "aria-label", mostrando ? "Mostrar contraseña" : "Ocultar contraseña"
  );
  icon.innerHTML = mostrando
    ? `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"></path><circle cx="12" cy="12" r="3"></circle>`
    : `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.3 20.3 0 0 1 4.22-5.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a20.3 20.3 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><path d="M1 1l22 22"></path>`;
});
</script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById("errorMsg");
  errorEl.classList.add("hidden");
  try {
    const data = await api("/api/auth/login", {
      method: "POST",
      auth: false,
      body: {
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      },
    });
    Auth.setToken(data.access_token);
    Auth.setUsuario(data.usuario);
    window.location.href = "dashboard.html";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>
