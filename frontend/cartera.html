<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cartera y Mora — RYM Inversiones</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/styles.css" />
</head>
<body class="min-h-screen">
<div class="flex flex-col md:flex-row">

  <aside class="w-full md:w-60 md:min-h-screen panel-2 p-3 md:p-4 flex flex-row md:flex-col items-center md:items-stretch justify-between gap-3 md:gap-0" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center gap-4 md:block min-w-0 overflow-x-auto">
      <div class="flex items-center gap-2 px-0 md:px-2 md:mb-8 shrink-0">
        <img src="static/img/logo-rym.jpeg" alt="RYM Inversiones" class="w-9 h-9 rounded-lg object-cover" />
        <span class="font-semibold leading-tight">RYM<span style="color:var(--accent)"> Inversiones</span></span>
      </div>
      <nav class="flex md:flex-col gap-1 md:gap-0 md:space-y-1 shrink-0">
        <a href="dashboard.html" class="sidebar-link">Dashboard</a>
        <a href="clientes.html" class="sidebar-link">Clientes</a>
        <a href="facturas.html" class="sidebar-link">Facturas</a>
        <a href="cartera.html" class="sidebar-link active">Cartera y Mora</a>
      </nav>
    </div>
    <div class="px-0 md:px-2 shrink-0">
      <p class="text-xs mb-2 hidden md:block" style="color:var(--text-dim)" id="usuarioNombre"></p>
      <button onclick="Auth.logout()" class="btn-ghost text-sm px-3 py-2 md:w-full">Salir</button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8 w-full min-w-0">
    <div class="mb-6">
      <h1 class="text-2xl font-semibold">Cartera y Mora</h1>
      <p class="text-sm" style="color:var(--text-dim)">Alertas tempranas por clasificación de días de atraso</p>
    </div>

    <div class="flex gap-3 mb-6">
      <button class="btn-ghost text-sm filtro" data-filtro="" onclick="filtrar('')">Todas</button>
      <button class="btn-ghost text-sm filtro" data-filtro="preventiva" onclick="filtrar('preventiva')">Preventiva</button>
      <button class="btn-ghost text-sm filtro" data-filtro="administrativa" onclick="filtrar('administrativa')">Administrativa</button>
      <button class="btn-ghost text-sm filtro" data-filtro="extrajudicial" onclick="filtrar('extrajudicial')">Extrajudicial</button>
    </div>

    <div class="panel overflow-hidden">
      <div class="overflow-x-auto">
      <table class="ledger w-full" style="min-width:680px;">
        <thead>
          <tr>
            <th>Factura</th><th>Cliente</th><th>Días atraso</th><th>Clasificación</th><th>Saldo capital</th><th>Interés</th><th>Recargo</th>
          </tr>
        </thead>
        <tbody id="tablaCartera"></tbody>
      </table>
      </div>
    </div>
  </main>
</div>

<script src="static/js/app.js"></script>
<script>
Auth.requireAuth();
document.getElementById("usuarioNombre").textContent = Auth.getUsuario()?.nombre_completo || "";

let filtroActual = "";
function filtrar(f) { filtroActual = f; cargar(); }

async function cargar() {
  try {
    const qs = filtroActual ? `?estado_mora=${filtroActual}` : "";
    const items = await api(`/api/cartera/vencidas${qs}`);
    document.getElementById("tablaCartera").innerHTML = items.map(i => `
      <tr>
        <td class="font-mono-ledger" data-label="Factura">${i.numero_factura}</td>
        <td data-label="Cliente">${i.cliente}</td>
        <td class="font-mono-ledger" data-label="Días atraso">${i.dias_atraso}</td>
        <td data-label="Clasificación"><span class="badge badge-${i.estado_mora}">${i.estado_mora.replace("_"," ")}</span></td>
        <td class="font-mono-ledger" data-label="Saldo capital">${fmt.money(i.saldo_capital)}</td>
        <td class="font-mono-ledger" data-label="Interés">${fmt.money(i.interes_acumulado)}</td>
        <td class="font-mono-ledger" data-label="Recargo">${fmt.money(i.recargo_mora)}</td>
      </tr>
    `).join("") || `<tr><td colspan="7" class="text-center py-8" style="color:var(--text-dim)">Sin cuentas en mora bajo este filtro.</td></tr>`;
  } catch (err) { toast(err.message, "error"); }
}
cargar();
</script>
</body>
</html>
