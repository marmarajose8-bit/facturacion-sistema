<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Sistema de Facturación</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/styles.css" />
</head>
<body class="min-h-screen">
<div class="flex flex-col md:flex-row">

  <aside class="w-full md:w-60 md:min-h-screen panel-2 p-3 md:p-4 flex flex-row md:flex-col items-center md:items-stretch justify-between gap-3 md:gap-0" style="border-bottom:1px solid var(--border);">
    <div class="flex items-center gap-4 md:block min-w-0 overflow-x-auto">
      <div class="flex items-center gap-2 px-0 md:px-2 md:mb-8 shrink-0">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center font-mono-ledger font-bold" style="background: var(--accent); color:#06231c;">$</div>
        <span class="font-semibold">Cartera<span style="color:var(--accent)">.</span></span>
      </div>
      <nav class="flex md:flex-col gap-1 md:gap-0 md:space-y-1 shrink-0">
        <a href="dashboard.html" class="sidebar-link active">Dashboard</a>
        <a href="clientes.html" class="sidebar-link">Clientes</a>
        <a href="facturas.html" class="sidebar-link">Facturas</a>
        <a href="cartera.html" class="sidebar-link">Cartera y Mora</a>
      </nav>
    </div>
    <div class="px-0 md:px-2 shrink-0">
      <p class="text-xs mb-2 hidden md:block" style="color:var(--text-dim)" id="usuarioNombre"></p>
      <button onclick="Auth.logout()" class="btn-ghost text-sm px-3 py-2 md:w-full">Salir</button>
    </div>
  </aside>

  <main class="flex-1 p-4 md:p-8 w-full min-w-0">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-6 md:mb-8">
      <div>
        <h1 class="text-2xl font-semibold">Panel general</h1>
        <p class="text-sm" style="color:var(--text-dim)">Resumen de facturación y cobros al corte de hoy</p>
      </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-5 mb-8">
      <div class="panel p-5">
        <p class="text-xs" style="color:var(--text-dim)">Total facturado</p>
        <p class="text-2xl font-mono-ledger mt-2" id="totalFacturado">—</p>
      </div>
      <div class="panel p-5">
        <p class="text-xs" style="color:var(--text-dim)">Total cobrado</p>
        <p class="text-2xl font-mono-ledger mt-2" style="color:var(--accent)" id="totalCobrado">—</p>
      </div>
      <div class="panel p-5">
        <p class="text-xs" style="color:var(--text-dim)">Pendiente por cobrar</p>
        <p class="text-2xl font-mono-ledger mt-2" style="color:var(--warn)" id="totalPendiente">—</p>
      </div>
      <div class="panel p-5">
        <p class="text-xs" style="color:var(--text-dim)">Facturas vencidas</p>
        <p class="text-2xl font-mono-ledger mt-2" style="color:var(--danger-2)" id="facturasVencidas">—</p>
      </div>
    </div>

    <div class="panel p-6">
      <h2 class="text-sm font-semibold mb-4" style="color:var(--text-dim)">CLASIFICACIÓN DE CARTERA</h2>
      <div id="resumenCartera" class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4"></div>
    </div>
  </main>
</div>

<script src="static/js/app.js"></script>
<script>
Auth.requireAuth();
document.getElementById("usuarioNombre").textContent = Auth.getUsuario()?.nombre_completo || "";

async function cargar() {
  try {
    const totales = await api("/api/dashboard/totales");
    document.getElementById("totalFacturado").textContent = fmt.money(totales.total_facturado);
    document.getElementById("totalCobrado").textContent = fmt.money(totales.total_cobrado);
    document.getElementById("totalPendiente").textContent = fmt.money(totales.total_pendiente);
    document.getElementById("facturasVencidas").textContent = totales.facturas_vencidas;

    const resumen = await api("/api/cartera/resumen");
    const labels = { al_dia: "Al día", preventiva: "Preventiva", administrativa: "Administrativa", extrajudicial: "Extrajudicial" };
    const cont = document.getElementById("resumenCartera");
    cont.innerHTML = Object.entries(resumen).map(([key, val]) => `
      <div class="panel-2 rounded-xl p-4">
        <span class="badge badge-${key}">${labels[key]}</span>
        <p class="text-xl font-mono-ledger mt-3">${fmt.money(val.monto)}</p>
        <p class="text-xs mt-1" style="color:var(--text-dim)">${val.cantidad} factura(s)</p>
      </div>
    `).join("");
  } catch (err) {
    toast(err.message, "error");
  }
}
cargar();
</script>
</body>
</html>
