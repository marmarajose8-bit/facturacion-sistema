<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facturas — RYM Inversiones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/styles.css" />
</head>
<body class="min-h-screen bg-gray-900 text-gray-100">
    <div class="flex flex-col md:flex-row min-h-screen">
        <!-- Sidebar -->
        <aside class="w-full md:w-60 bg-gray-800 p-4 border-r border-gray-700">
            <div class="flex items-center gap-2 mb-6">
                <span class="text-xl font-bold text-amber-500">RYM Inversiones</span>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="block px-3 py-2 rounded hover:bg-gray-700">Dashboard</a>
                <a href="clientes.html" class="block px-3 py-2 rounded hover:bg-gray-700">Clientes</a>
                <a href="facturas.html" class="block px-3 py-2 rounded bg-amber-600 text-white font-medium">Facturas</a>
                <a href="cartera.html" class="block px-3 py-2 rounded hover:bg-gray-700">Cartera y Mora</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <header class="mb-6">
                <h1 class="text-2xl font-bold">Facturas y Préstamos</h1>
                <p class="text-sm text-gray-400">Control de cobros, capital e intereses de la calle</p>
            </header>

            <!-- Formulario de Autocompletado Inteligente -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-6 shadow-lg">
                <h2 class="text-lg font-semibold mb-2 text-amber-400">⚡ Llenado Rápido (Modo Calle)</h2>
                <p class="text-xs text-gray-400 mb-3">Escribe en una sola línea: <b>Nombre, Capital, Porcentaje (5, 10, 15, 20), Frecuencia</b> (Ej: <i>Juan Pérez, 10000, 20, quincenal</i>)</p>
                
                <input type="text" id="smartFillInput" placeholder="Ej: Juan Pérez, 10000, 20, quincenal" 
                    class="w-full bg-gray-900 border border-gray-600 rounded p-3 text-white focus:border-amber-500 focus:outline-none mb-4">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Cliente</label>
                        <input type="text" id="inputCliente" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white" placeholder="Nombre del cliente">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Frecuencia de Cobro</label>
                        <select id="selectFrecuencia" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white">
                            <option value="Semanal">Semanal</option>
                            <option value="Quincenal">Quincenal (15 y 30)</option>
                            <option value="Mensual">Mensual</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Total a Cobrar (Capital + Interés)</label>
                        <input type="number" id="inputTotal" class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-sm text-white font-bold text-amber-400" placeholder="0.00">
                    </div>
                </div>

                <div class="mt-4 flex justify-end">
                    <button onclick="alert('Préstamo preparado para emitir')" class="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2 rounded font-medium text-sm transition">Emitir Factura</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('smartFillInput').addEventListener('input', function(e) {
            const val = e.target.value;
            const partes = val.split(',').map(p => p.trim());
            
            if (partes.length >= 3) {
                document.getElementById('inputCliente').value = partes[0];
                const capital = parseFloat(partes[1]) || 0;
                const porc = parseFloat(partes[2]) || 0;
                const freq = (partes[3] || '').toLowerCase();

                // Cálculo callejero: Capital + (Capital * Porcentaje / 100)
                const totalConInteres = capital + (capital * (porc / 100));
                document.getElementById('inputTotal').value = totalConInteres;

                // Frecuencia automática limpia
                const sel = document.getElementById('selectFrecuencia');
                if (freq.includes('sem')) sel.value = 'Semanal';
                else if (freq.includes('quin') || freq.includes('15')) sel.value = 'Quincenal (15 y 30)';
                else sel.value = 'Mensual';
            }
        });
    </script>
</body>
</html>
